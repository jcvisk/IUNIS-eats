<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base-estudiante :: layout(~{::content})}">
<body>

<th:block th:fragment="content">

    <div class="page-header">
        <p class="eyebrow">Periodo del día</p>
        <h1 class="page-title">Menú del día</h1>
        <p class="page-subtitle">Consulta los platillos disponibles antes del receso.</p>
    </div>

    <!-- Tabs de categorías -->
    <div class="tabs-categoria">
        <!-- Agregamos type="button" para evitar que se comporten como formularios -->
        <button type="button" class="tab active" data-categoria="todos">Todos</button>
        <button type="button" class="tab" data-categoria="comida">Comidas</button>
        <button type="button" class="tab" data-categoria="bebida">Bebidas</button>
        <button type="button" class="tab" data-categoria="snack">Snacks</button>
    </div>

    <!-- Grid de platillos -->
    <div class="grid-platillos">
        <article class="card-platillo" th:each="p : ${platillos}" th:attr="data-categoria=${#strings.toLowerCase(p.categoria)}">

            <div class="card-image">
                <img th:if="${p.imagen != null and !p.imagen.isEmpty()}"
                     th:src="${p.imagen}"
                     th:alt="${p.nombre}">
                <div th:unless="${p.imagen != null and !p.imagen.isEmpty()}"
                     class="image-placeholder"></div>
            </div>

            <div class="card-body">
                <h3 th:text="${p.nombre}">Nombre del platillo</h3>
                <p th:text="${p.descripcion}">Descripción del platillo</p>

                <div class="card-footer">
                    <span class="price"
                          th:text="'$' + ${#numbers.formatDecimal(p.precio, 1, 2)}">$0.00</span>
                    <span class="badge"
                          th:classappend="${p.disponibilidad} ? 'badge-success' : 'badge-danger'"
                          th:text="${p.disponibilidad} ? 'Disponible' : 'Agotado'">
                        Disponible
                    </span>
                </div>

                <form th:action="@{/carrito/agregar/{id}(id=${p.id})}" method="post" style="margin-top: 12px;">
                    <button class="btn-primary btn-full"
                            type="submit"
                            th:disabled="${!p.disponibilidad}"
                            th:text="${p.disponibilidad} ? 'Agregar al pedido' : 'No disponible'">
                        Agregar al pedido
                    </button>
                </form>
            </div>

        </article>

        <div th:if="${platillos == null or platillos.isEmpty()}"
             style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--texto-sec);">
            Aún no hay platillos publicados.
        </div>
    </div>

    <!-- Script para los filtros (AHORA SÍ, DENTRO DEL FRAGMENTO) -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const botones = document.querySelectorAll('.tab');
            const tarjetas = document.querySelectorAll('.card-platillo');

            botones.forEach(boton => {
                boton.addEventListener('click', function() {
                    // Cambiar clase activa
                    botones.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    // Filtrar
                    const categoriaSeleccionada = this.getAttribute('data-categoria');

                    tarjetas.forEach(tarjeta => {
                        const categoriaTarjeta = tarjeta.getAttribute('data-categoria');

                        if (categoriaSeleccionada === 'todos' || categoriaSeleccionada === categoriaTarjeta) {
                            tarjeta.style.display = 'flex';
                        } else {
                            tarjeta.style.display = 'none';
                        }
                    });
                });
            });
        });
    </script>

</th:block>

</body>
</html>
