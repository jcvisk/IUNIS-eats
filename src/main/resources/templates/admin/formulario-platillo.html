<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base-admin :: layout(~{::content})}">
<body>

<th:block th:fragment="content">

    <h1 class="page-title-admin"
        th:text="${platillo.id != null ? 'Editar platillo' : 'Nuevo platillo'}">
        Nuevo platillo
    </h1>

    <form th:action="@{/admin/platillos/guardar}" th:object="${platillo}" method="post" class="formulario-platillo">

        <input type="hidden" th:field="*{id}">

        <!-- Contenedor de las dos columnas -->
        <div class="form-grid">

            <!-- Columna izquierda: Textos -->
            <div class="form-col-izq">
                <div class="campo">
                    <label>Nombre del platillo</label>
                    <input type="text" th:field="*{nombre}" required>
                    <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" style="color: var(--rojo); font-size: 0.8rem; display: block; margin-top: 4px;"></span>
                </div>

                <div class="campo">
                    <label>Descripción corta</label>
                    <textarea th:field="*{descripcion}" rows="5"></textarea>
                    <span th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}" style="color: var(--rojo); font-size: 0.8rem; display: block; margin-top: 4px;"></span>
                </div>

                <div class="form-row-2">
                    <div class="campo">
                        <label>Categoría</label>
                        <select th:field="*{categoria}">
                            <option value="Comida">Comidas</option>
                            <option value="Bebida">Bebidas</option>
                            <option value="Snack">Snacks</option>
                        </select>
                        <span th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}" style="color: var(--rojo); font-size: 0.8rem; display: block; margin-top: 4px;"></span>
                    </div>

                    <div class="campo">
                        <label>Precio ($ MXN)</label>
                        <input type="number" step="0.01" th:field="*{precio}" required>
                        <span th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}" style="color: var(--rojo); font-size: 0.8rem; display: block; margin-top: 4px;"></span>
                    </div>
                </div>
            </div> <!-- 👈 Cierre de columna izquierda -->

            <!-- Columna derecha: Imagen y disponibilidad -->
            <div class="form-col-der">
                <div class="campo">
                    <label>URL de imagen (opcional)</label>
                    <input type="text" th:field="*{imagen}" placeholder="/images/platillos/torta.jpg">
                </div>

                <div class="preview-imagen">
                    <img th:if="${platillo.imagen != null and !platillo.imagen.isEmpty()}"
                         th:src="${platillo.imagen}" alt="Preview">
                    <div th:unless="${platillo.imagen != null and !platillo.imagen.isEmpty()}"
                         class="preview-vacia"></div>
                </div>

                <div class="campo-toggle">
                    <label class="switch-label">
                        <input type="checkbox" th:field="*{disponibilidad}" class="switch-input">
                        <span class="switch-track"><span class="switch-knob"></span></span>
                        <span>Visible en el catálogo</span>
                    </label>
                </div>
            </div> <!-- 👈 Cierre de columna derecha -->

        </div> <!-- 👈 AQUÍ ESTABA EL CIERRE QUE FALTABA -->

        <!-- Botones de acción -->
        <div class="form-actions-bar">
            <button type="submit" class="btn-verde">Guardar platillo</button>
            <a th:href="@{/admin/platillos}" class="btn-cancelar">Cancelar</a>
        </div>

    </form>

</th:block>

</body>
</html>
