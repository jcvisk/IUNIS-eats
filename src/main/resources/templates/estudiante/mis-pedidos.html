<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base-estudiante :: layout(~{::content})}">
<body>

<th:block th:fragment="content">

    <div class="page-header">
        <p class="eyebrow">Historial</p>
        <h1 class="page-title">Mis pedidos</h1>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px; max-width: 800px; margin: 0 auto;">

        <div th:each="p : ${pedidos}" class="card-platillo" style="padding: 20px;">
            <!-- Encabezado del pedido -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <div>
                    <strong style="font-size: 1.125rem;" th:text="'#' + ${p.id}">#43</strong>
                    <span style="color: var(--texto-sec); font-size: 0.875rem; margin-left: 12px;"
                          th:text="${#temporals.format(p.fechaHora, 'dd/MM/yyyy HH:mm')}">Fecha</span>
                </div>
                <span class="badge"
                      th:classappend="${p.estado == 'PENDIENTE' ? 'badge-danger' : 'badge-success'}"
                      th:text="${p.estado}">ESTADO</span>
            </div>

            <!-- Detalle de los platillos -->
            <div style="border-top: 1px solid var(--borde); border-bottom: 1px solid var(--borde); padding: 12px 0; margin-bottom: 12px;">
                <div th:each="item : ${detallesPorPedido[p.id]}" style="display: flex; justify-content: space-between; font-size: 0.875rem; margin-bottom: 6px;">
                    <span style="color: var(--texto-sec);" th:text="${item.cantidad} + 'x ' + ${item.nombre}">1x Platillo</span>
                    <span th:text="'$' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">$0.00</span>
                </div>
            </div>

            <!-- Total -->
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="color: var(--texto-sec);">Total del pedido</span>
                <strong style="color: var(--ambar); font-size: 1.25rem;" th:text="'$' + ${#numbers.formatDecimal(p.total, 1, 2)}">$0.00</strong>
            </div>
        </div>

        <div th:if="${pedidos == null or pedidos.isEmpty()}" class="empty-state" style="text-align: center; padding: 40px;">
            <p style="color: var(--texto-sec);">Aún no has realizado ningún pedido.</p>
            <a th:href="@{/menu}" class="btn-primary" style="margin-top: 16px;">Ir al menú</a>
        </div>
    </div>

</th:block>

</body>
</html>
