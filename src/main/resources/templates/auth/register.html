<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | IUNIS Eats</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<main class="form-card">
    <p class="eyebrow">IUNIS Eats</p>
    <h1>Registro de estudiante</h1>
    <p class="description">Crea tu cuenta para ingresar a IUNIS Eats.</p>

    <p class="alert"
       th:if="${formError}"
       th:text="${formError}"
       role="alert">
    </p>

    <form class="user-form"
          th:object="${user}"
          th:action="@{/register}"
          method="post">

        <label for="userName">Nombre de usuario</label>
        <input id="userName"
               type="text"
               th:field="*{userName}"
               maxlength="255"
               autocomplete="username"
               required>

        <label for="password">Contraseña</label>
        <input id="password"
               type="password"
               th:field="*{password}"
               maxlength="255"
               autocomplete="new-password"
               required>

        <div class="form-actions">
            <a class="button button-secondary"
               th:href="@{/login}">
                Ya tengo cuenta
            </a>

            <button class="button button-primary" type="submit">
                Registrarme
            </button>
        </div>

    </form>
</main>

</body>
</html>
