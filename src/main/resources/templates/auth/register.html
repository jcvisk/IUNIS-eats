<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de estudiante | IUNIS Eats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div class="auth-wrapper">
    <main class="auth-card">

        <img th:src="@{/images/logo-iunis-eats.png}"
             alt="IUNIS Eats"
             class="auth-logo">

        <h1>Registro de estudiante</h1>
        <p class="auth-subtitle">Crea tu cuenta para pedir antes del receso.</p>

        <p class="alert"
           th:if="${formError}"
           th:text="${formError}"
           role="alert"></p>

        <form th:object="${user}"
              th:action="@{/register}"
              method="post">

            <div class="campo">
                <label for="userName">Número de control</label>
                <input id="userName"
                       type="text"
                       th:field="*{userName}"
                       maxlength="255"
                       autocomplete="username"
                       placeholder="Ej. 20230145"
                       required>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input id="password"
                       type="password"
                       th:field="*{password}"
                       maxlength="255"
                       autocomplete="new-password"
                       placeholder="••••••••"
                       required>
            </div>

            <button class="btn-primary" type="submit">
                Registrar cuenta
            </button>

        </form>

        <p class="auth-link">
            Ya tengo cuenta ·
            <a th:href="@{/login}">Iniciar sesión</a>
        </p>

    </main>
</div>

</body>
</html>
