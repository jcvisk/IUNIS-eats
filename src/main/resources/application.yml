spring:
  application:
    name: iunis-eats

  thymeleaf:
    cache: false

  datasource:
    url: jdbc:postgresql://localhost:5432/iuniseatsdb
    username: postgres
    password: sasa
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080