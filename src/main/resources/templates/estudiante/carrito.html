<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base-estudiante :: layout(~{::content})}">
<body>

<th:block th:fragment="content">

    <div class="page-header">
        <p class="eyebrow">Revisión</p>
        <h1 class="page-title">Tu pedido</h1>
    </div>

    <div class="card-platillo" style="padding: 24px; max-width: 800px; margin: 0 auto;">

        <div th:if="${carrito != null and !carrito.isEmpty()}">
            <!-- Lista de items -->
            <div th:each="item : ${carrito}" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--borde); padding: 16px 0;">
                <div>
                    <h3 style="margin: 0;" th:text="${item.nombre}">Nombre</h3>
                    <p style="color: var(--texto-sec); font-size: 0.875rem; margin: 4px 0;"
                       th:text="'$' + ${#numbers.formatDecimal(item.precio, 1, 2)} + ' c/u'">$0.00 c/u</p>
                </div>
                <div style="display: flex; align-items: center; gap: 16px;">
                    <span style="font-weight: 600;" th:text="'x' + ${item.cantidad}">x1</span>
                    <strong style="color: var(--ambar);" th:text="'$' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">$0.00</strong>
                </div>
            </div>

            <!-- Total -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 16px; border-top: 2px solid var(--verde);">
                <h2 style="margin: 0; font-size: 1.25rem;">Total a pagar</h2>
                <h2 style="margin: 0; color: var(--ambar);" th:text="'$' + ${#numbers.formatDecimal(total, 1, 2)}">$0.00</h2>
            </div>

            <div class="notice" style="background: var(--ambar-claro); border-left-color: var(--ambar); margin-top: 24px; padding: 12px; border-radius: 4px;">
                El pago se realiza directamente en la cafetería al momento de recoger tu pedido.
            </div>

            <!-- Botones -->
            <form th:action="@{/carrito/confirmar}" method="post" style="margin-top: 24px; display: flex; flex-direction: column; gap: 12px;">
                <button type="submit" class="btn-primary btn-full" style="padding: 14px;">Confirmar pedido</button>
                <a th:href="@{/menu}" class="btn-outline btn-full" style="text-align: center; padding: 14px;">Seguir consultando</a>
            </form>
        </div>

        <div th:if="${carrito == null or carrito.isEmpty()}" class="empty-state" style="text-align: center; padding: 40px;">
            <h2 style="color: var(--texto-sec);">Tu carrito está vacío</h2>
            <a th:href="@{/menu}" class="btn-primary" style="margin-top: 16px;">Ir al menú</a>
        </div>

    </div>

</th:block>

</body>
</html>
