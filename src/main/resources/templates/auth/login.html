<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al sistema | IUNIS Eats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div class="auth-wrapper">
    <main class="auth-card">

        <img th:src="@{/images/logo-iunis-eats.png}"
             alt="IUNIS Eats"
             class="auth-logo">

        <h1>Acceso al sistema</h1>
        <p class="auth-subtitle">Ingresa con tu cuenta institucional.</p>

        <p class="alert" th:if="${param.error}" role="alert">
            Usuario o contraseña incorrectos.
        </p>

        <p class="notice" th:if="${param.logout}">
            Sesión cerrada correctamente.
        </p>

        <p class="notice" th:if="${notice}" th:text="${notice}"></p>

        <form th:action="@{/login}" method="post">

            <div class="campo">
                <label for="username">Número de control</label>
                <input id="username"
                       name="username"
                       type="text"
                       autocomplete="username"
                       placeholder="Ej. 20230145"
                       required>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input id="password"
                       name="password"
                       type="password"
                       autocomplete="current-password"
                       placeholder="••••••••"
                       required>
            </div>

            <button class="btn-primary" type="submit">
                Entrar
            </button>

        </form>

        <p class="auth-link">
            ¿No tienes cuenta?
            <a th:href="@{/register}">Regístrate</a>
        </p>

        <p class="auth-footer">
            Instituto Universitario del Sureste · Cafetería
        </p>

    </main>
</div>

</body>
</html>
