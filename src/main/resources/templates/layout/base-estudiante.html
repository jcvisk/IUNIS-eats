
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${pageTitle} + ' · IUNIS Eats'">IUNIS Eats</title>

    <link rel="icon" type="image/png" th:href="@{/images/logo-iunis-eats.png}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="layout-estudiante">

<!-- ===== NAVBAR ===== -->
<header class="navbar-estudiante">

    <a th:href="@{/menu}" class="navbar-brand">
        <img th:src="@{/images/logo-iunis-eats.png}"
             alt="IUNIS Eats"
             class="brand-logo">
    </a>

    <!-- Navegación del estudiante -->
    <nav class="navbar-actions" aria-label="Navegación del estudiante">

        <a th:href="@{/notificaciones}" class="btn-outline-sm">
            Notificaciones
        </a>

        <a th:href="@{/menu}" class="btn-outline-sm">
            Menú
        </a>

        <a th:href="@{/carrito}" class="btn-outline-sm">
            Carrito
        </a>

        <a th:href="@{/mis-pedidos}" class="btn-outline-sm">
            Mis pedidos
        </a>

        <form th:action="@{/logout}" method="post" class="form-logout-estudiante">
            <button type="submit" class="btn-outline-sm">
                Cerrar sesión
            </button>
        </form>

    </nav>
</header>

<!-- ===== FRANJA DE PERIODO ===== -->
<div class="periodo-banner" th:if="${mostrarBanner != false}">
    Periodo abierto hasta las 13:00 hrs
</div>

<!-- ===== MENSAJES GENERALES DEL SISTEMA ===== -->
<div class="mensajes-sistema"
     th:if="${successMessage != null or errorMessage != null}">

    <div class="alert alert-success"
         th:if="${successMessage != null}"
         role="status"
         aria-live="polite">

        <span th:text="${successMessage}"></span>

    </div>

    <div class="alert alert-error"
         th:if="${errorMessage != null}"
         role="alert">

        <span th:text="${errorMessage}"></span>

    </div>

</div>

<!-- ===== CONTENIDO VARIABLE ===== -->
<main class="contenido-estudiante">
    <div th:replace="${content}"></div>
</main>

</body>
</html>
